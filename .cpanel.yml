---
deployment:
  tasks:
    # Replace this with the existing live Laravel directory, separate from this repository.
    - export DEPLOYPATH=/home/kvskyspq/agentlink.ng
    - >-
      if [ "$DEPLOYPATH" = /home/USERNAME/apps/obb ]; then
      echo 'Set DEPLOYPATH in .cpanel.yml to your live Laravel directory before deploying.' >&2;
      exit 1;
      fi
    - test -d "$DEPLOYPATH"
    - >-
      /usr/bin/rsync -a
      --exclude='/.git/'
      --exclude='/.github/'
      --exclude='/tests/'
      --exclude='/phpunit.xml'
      --exclude='/.phpunit*'
      --exclude='/.env*'
      --exclude='/vendor/'
      --exclude='/node_modules/'
      --exclude='/storage/'
      --exclude='/.agents/'
      --exclude='/.ai/'
      --exclude='/.claude/'
      --exclude='/.codex/'
      --exclude='/.junie/'
      --exclude='/.idea/'
      --exclude='/.vscode/'
      --exclude='/AGENTS.md'
      --exclude='/CLAUDE.md'
      --exclude='/README.md'
      --exclude='/compose.yaml'
      --exclude='/.cpanel.yml'
      ./ "$DEPLOYPATH/"
    - /opt/cpanel/ea-php85/root/usr/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction --working-dir="$DEPLOYPATH"
